# AI relay: ask Claude from an Issue (runs on the Claude Max plan, not the API).
# Trigger: add the "claude" label to an Issue, or write "@claude" in an Issue / comment.
# Only people with write access can trigger it (the action checks this).
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN (made with `claude setup-token` on a PC).
name: Claude

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (github.event.label.name == 'claude' || contains(github.event.issue.body, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: claude
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Bash(git fetch origin *),WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com)"
            --append-system-prompt "日本語で書く。Issue を依頼書として最後までやり、途中で質問しない(作り方の迷いは仮決めして報告に書く。調べ物の事実は推測で埋めず、不明・保留と報告する)。成果物は repo のファイル(調べ物は research/ の下)にして新しいブランチに commit し、PR を作る。最後に Issue へ『何を・どこに・何件・残った課題』を短くコメントする。止まる時も理由をコメントしてから止まる。"
