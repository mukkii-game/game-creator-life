name: Deploy to Cloudflare Workers

# 公開の標準(2026-10-12 Mukkii 決定)。Workers + Static Assets で dist/ を出す。URL は https://<repo名>.mucky-totoro.workers.dev
# 鍵(CLOUDFLARE_API_TOKEN・CLOUDFLARE_ACCOUNT_ID)は ai-ops の「Enable Claude」が配る。無ければ黙って終了。
# 事前に Cloudflare 側で作るものは無い(初回の deploy で Worker ができる)。

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'cloudflare'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if not configured
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then echo 'go=true' >> "$GITHUB_OUTPUT"; else
            echo '::notice::CLOUDFLARE_API_TOKEN が未設定のため Cloudflare へのデプロイを飛ばします。'
            echo 'go=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: 'npm'
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - if: steps.gate.outputs.go == 'true'
        run: npm run build
      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.36.0'
          command: deploy --name ${{ github.event.repository.name }}
